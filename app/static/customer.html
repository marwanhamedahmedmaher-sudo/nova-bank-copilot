<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Bank · Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand:#0b3a6e;--brand-2:#1565c0;--accent:#7fd3d5;--ink:#0f1b2d;--muted:#5b6b80;--line:#e3e8ef;--bg:#e9eef5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--bg);font:15px/1.5 Inter,"IBM Plex Sans Arabic",system-ui,sans-serif;color:var(--ink);display:flex;justify-content:center;align-items:center}
.phone{width:min(420px,100vw);height:min(820px,100vh);background:#fff;display:flex;flex-direction:column;border-radius:28px;overflow:hidden;box-shadow:0 20px 60px rgba(15,27,45,.22)}
@media (max-width:480px){.phone{border-radius:0;height:100vh}}
header{background:var(--brand);color:#fff;padding:18px 18px 14px}
header .logo{font-weight:700;font-size:17px}
header .logo span{color:var(--accent)}
header .who{font-size:12.5px;opacity:.85;margin-top:2px}
header .who b{font-weight:600}
.msgs{flex:1;overflow-y:auto;padding:16px 14px;background:#f6f8fb;display:flex;flex-direction:column;gap:8px}
.hello{align-self:center;text-align:center;color:var(--muted);font-size:13px;max-width:280px;margin:18px 0}
.m{max-width:82%;padding:10px 13px;border-radius:16px;white-space:pre-wrap;word-wrap:break-word}
.m.me{align-self:flex-end;background:var(--brand-2);color:#fff;border-bottom-right-radius:5px}
.m.bank{align-self:flex-start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.m.rtl{direction:rtl;text-align:right;font-family:"IBM Plex Sans Arabic",Inter,sans-serif}
.label{font-size:11px;color:var(--muted);margin:4px 4px -4px}
.label.me{align-self:flex-end}
.typing{align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 14px;display:none}
.typing i{display:inline-block;width:6px;height:6px;margin:0 2px;border-radius:50%;background:#9aa8ba;animation:b 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-4px)}}
form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line);background:#fff}
textarea{flex:1;border:1px solid var(--line);border-radius:20px;padding:10px 14px;font:inherit;resize:none;height:44px;max-height:120px;outline:none}
textarea:focus{border-color:var(--brand-2)}
button{border:0;background:var(--brand-2);color:#fff;border-radius:50%;width:44px;height:44px;font-size:18px;cursor:pointer;flex:none}
button:disabled{opacity:.5;cursor:wait}
header{display:flex;align-items:flex-start;gap:10px}
header .sp{flex:1}
header .end{background:rgba(255,255,255,.15);border-radius:14px;width:auto;height:auto;padding:5px 12px;font-size:12.5px;font-weight:600}
header .end[hidden]{display:none}
.rate{align-self:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;text-align:center;max-width:300px;margin:6px 0}
.rate b{display:block;margin-bottom:6px}
.rate .st{display:flex;justify-content:center;gap:4px}
.rate .st button{background:none;color:#c3ccd8;width:36px;height:36px;font-size:28px;border-radius:8px;padding:0}
.rate .st button.on{color:#e0a100}
.rate .hint{color:var(--muted);font-size:12.5px;margin-top:4px}
.err{color:#b42318;font-size:12px;text-align:center;padding:4px;display:none}
</style>
</head>
<body>
<div class="phone">
  <header><div><div class="logo">Nova Bank <span>· Chat</span></div>
    <div class="who">Signed in as <b id="name">…</b> · verified in the app</div></div><span class="sp"></span>
    <button class="end" id="end" hidden>End chat</button></header>
  <div class="msgs" id="msgs">
    <div class="hello">Hi, how can we help today? Ask about a dispute, a fee or your card, in English or Arabic.</div>
    <div class="typing" id="typing"><i></i><i></i><i></i></div>
  </div>
  <div class="err" id="err">Connection lost. Retrying…</div>
  <form id="f"><textarea id="t" placeholder="Type a message…" aria-label="Message"></textarea><button id="send" aria-label="Send">➤</button></form>
</div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isRtl = s => /[؀-ۿ]/.test(s);
let last = 0, busy = false, lastSide = null, chatNo = null, rated = null;

function add(m){
  const me = m.role === "customer";
  const typing = $("#typing");
  if(lastSide !== me) typing.insertAdjacentHTML("beforebegin", `<div class="label ${me ? "me" : ""}">${me ? "You" : "Nova Bank"}</div>`);
  typing.insertAdjacentHTML("beforebegin", `<div class="m ${me ? "me" : "bank"} ${isRtl(m.text) ? "rtl" : ""}">${esc(m.text)}</div>`);
  lastSide = me;
}
const scrollDown = () => { const b = $("#msgs"); b.scrollTop = b.scrollHeight; };

async function poll(){
  if(busy) return;
  busy = true;
  try{
    const r = await fetch(`/api/customer/chat?after=${last}`);
    if(!r.ok) throw new Error(r.status);
    const d = await r.json();
    $("#name").textContent = d.customer_name;
    if(chatNo !== null && d.chat_no !== chatNo){ busy = false; return newChat(d); }  // the chat ended: start a clean one
    chatNo = d.chat_no;
    if(d.rate_for && rated !== d.rate_for && !$("#rate")) askRating(d.rate_for);
    if(!d.rate_for && $("#rate") && !$("#rate").dataset.done) $("#rate").remove();
    d.messages.forEach(m => { add(m); last = Math.max(last, m.id); });
    $("#end").hidden = last === 0;
    $("#typing").style.display = d.typing ? "block" : "none";
    if(d.messages.length || d.typing) scrollDown();
    $("#err").style.display = "none";
  }catch{ $("#err").style.display = "block"; }
  busy = false;
}

// The chat ended (by her or the agent): clear the screen, ask for a rating, and the next message opens a new chat.
function newChat(d){
  document.querySelectorAll("#msgs .m, #msgs .label, #rate").forEach(el => el.remove());
  last = 0; lastSide = null; chatNo = d.chat_no; $("#end").hidden = true;
  if(d.rate_for) askRating(d.rate_for);
  poll();
}
function askRating(no){
  $("#typing").insertAdjacentHTML("beforebegin", `<div class="rate" id="rate"><b>Your chat has ended. How did we do?</b>
    <div class="st">${[1,2,3,4,5].map(n => `<button data-n="${n}" aria-label="${n} star${n>1?"s":""}">★</button>`).join("")}</div>
    <div class="hint">Need anything else? Just type below to start a new chat.</div></div>`);
  document.querySelectorAll("#rate .st button").forEach(b => {
    b.onmouseenter = () => document.querySelectorAll("#rate .st button").forEach(x => x.classList.toggle("on", +x.dataset.n <= +b.dataset.n));
    b.onclick = async () => {
      try{
        const r = await fetch("/api/customer/rate", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({chat_no:no, stars:+b.dataset.n})});
        if(!r.ok) throw new Error(r.status);
      }catch{ $("#err").style.display = "block"; return; }
      rated = no;
      $("#rate").dataset.done = "1";
      $("#rate").innerHTML = `<b>Thank you for your feedback ${"★".repeat(+b.dataset.n)}</b><div class="hint">Need anything else? Just type below.</div>`;
    };
  });
}
$("#end").onclick = async () => {
  if(!confirm("End this chat?")) return;
  try{ const r = await fetch("/api/customer/end", {method:"POST"}); if(!r.ok) throw new Error(r.status); }
  catch{ $("#err").style.display = "block"; return; }
  poll();
};

$("#f").onsubmit = async e => {
  e.preventDefault();
  const text = $("#t").value.trim();
  if(!text) return;
  $("#send").disabled = true;
  try{
    const r = await fetch("/api/customer/chat", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({text})});
    if(!r.ok) throw new Error(r.status);
    $("#t").value = ""; $("#t").style.height = "44px";
    await poll();
  }catch{ $("#err").style.display = "block"; }
  $("#send").disabled = false; $("#t").focus();
};
$("#t").addEventListener("keydown", e => { if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); $("#f").requestSubmit(); } });
$("#t").addEventListener("input", e => { e.target.style.height = "44px"; e.target.style.height = Math.min(e.target.scrollHeight, 120) + "px"; });

poll();
setInterval(poll, 1200);
</script>
</body>
</html>
