<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova Agent Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f6f9; --panel:#fff; --ink:#0f1b2d; --muted:#5b6b80; --line:#e3e8ef;
  --brand:#0b3a6e; --brand-2:#1565c0; --accent:#0f8b8d;
  --ok:#137a43; --ok-bg:#e7f6ee; --bad:#b42318; --bad-bg:#fdecea; --warn:#9a6700; --warn-bg:#fff6dd;
  --chip:#eef3fa;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,"IBM Plex Sans Arabic",system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--brand);color:#fff}
header .logo{font-weight:700;letter-spacing:.3px;font-size:16px}
header .logo span{color:#7fd3d5}
header .sp{flex:1}
header .pill{background:rgba(255,255,255,.14);padding:4px 10px;border-radius:999px;font-size:12px}
main{display:grid;grid-template-columns:280px minmax(0,1fr) 360px;gap:14px;padding:14px;height:calc(100vh - 48px)}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:auto;min-height:0}
.col h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.case{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.case:hover{background:#f8fafc}
.case.active{background:#eaf2fd;border-left:3px solid var(--brand-2);padding-left:11px}
.case .top{display:flex;justify-content:space-between;font-weight:600}
.case .meta{color:var(--muted);font-size:12px;margin:2px 0 4px}
.case .msg{font-size:12.5px;color:#33435a;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--chip);color:var(--brand);margin-right:4px;font-weight:500}
.center{display:flex;flex-direction:column}
.convo{padding:16px 18px;border-bottom:1px solid var(--line)}
.bubble{background:#f1f4f8;border-radius:14px 14px 14px 4px;padding:12px 14px;max-width:85%;font-size:15px}
.who{font-size:12px;color:var(--muted);margin-bottom:6px}
textarea{width:100%;min-height:62px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;resize:vertical;margin-top:12px}
.row{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer}
button.primary{background:var(--brand-2);border-color:var(--brand-2);color:#fff;font-weight:600}
button.primary:disabled{opacity:.6;cursor:wait}
button:hover{filter:brightness(.97)}
.hint{color:var(--muted);font-size:12px}
.draft{padding:16px 18px;flex:1}
.empty{color:var(--muted);text-align:center;margin-top:60px}
.status{display:inline-flex;align-items:center;gap:6px;font-weight:600;padding:4px 10px;border-radius:999px;font-size:12.5px}
.status.ready{background:var(--ok-bg);color:var(--ok)}
.status.blocked{background:var(--bad-bg);color:var(--bad)}
.card{border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:12px}
.card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.reply{font-size:16px;line-height:1.6;background:#f7fbff;border:1px solid #d6e6fb;border-radius:10px;padding:12px 14px}
.reply.rtl,.bubble.rtl{direction:rtl;text-align:right;font-family:"IBM Plex Sans Arabic",Inter,sans-serif}
.reply[contenteditable]{cursor:text;outline:none}
.reply[contenteditable]:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px #dbe8fb}
.tag.edited{background:var(--warn-bg);color:var(--warn)}
[hidden]{display:none !important}
input.note{flex:1;min-width:220px;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit}
.en{color:var(--muted);margin-top:8px;font-size:13.5px}
.fact{padding:8px 0;border-bottom:1px dashed var(--line)}
.fact:last-child{border-bottom:0}
.cite{display:inline-block;background:var(--chip);color:var(--brand);border-radius:6px;padding:1px 7px;margin:3px 4px 0 0;font-size:12px;cursor:pointer;font-weight:500}
.cite:hover{background:#dce8f8}
.action{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.action:last-child{border-bottom:0}
.action b{font-weight:600}
.approver{font-size:11.5px;color:var(--warn);background:var(--warn-bg);padding:2px 8px;border-radius:999px;white-space:nowrap}
.check{display:flex;gap:8px;padding:5px 0;font-size:13px}
.check .i{width:18px;text-align:center;font-weight:700}
.check.pass .i{color:var(--ok)} .check.fail .i{color:var(--bad)} .check.warn .i{color:var(--warn)}
.check .d{color:var(--muted)}
.flags .tag{background:var(--bad-bg);color:var(--bad)}
.metrics{display:flex;gap:16px;color:var(--muted);font-size:12px;margin-top:14px;flex-wrap:wrap}
.cust{padding:14px}
.cust .name{font-size:17px;font-weight:700}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:13px;margin-top:10px}
.kv div:nth-child(odd){color:var(--muted)}
.verified{color:var(--ok);font-weight:600;font-size:12px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td{padding:6px 14px;border-bottom:1px solid var(--line);vertical-align:top}
td.amt{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
tr.hl td{background:#fff7d6}
.st{font-size:11px;padding:1px 6px;border-radius:999px;background:var(--chip)}
.st.disputed,.st.declined{background:var(--bad-bg);color:var(--bad)}
.st.pending,.st.awaiting_merchant,.st.under_review,.st.submitted{background:var(--warn-bg);color:var(--warn)}
.sub{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:12px 14px 6px}
.policy{margin:0 14px 14px;padding:12px;border:1px solid #d6e6fb;background:#f7fbff;border-radius:10px;font-size:13px;display:none}
.policy b{display:block;margin-bottom:4px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:9}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:1100px){main{grid-template-columns:1fr;height:auto}.col{max-height:none}}
/* modes, risk labels, dev mode */
.modes{display:inline-flex;background:rgba(255,255,255,.12);border-radius:999px;padding:3px}
.modes button{background:transparent;border:0;color:#cfe0f5;border-radius:999px;padding:4px 12px;font-size:12.5px;font-weight:600}
.modes button.on{background:#fff;color:var(--brand)}
.devtoggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;cursor:pointer;user-select:none}
body:not(.dev) .devonly{display:none !important}
.risk{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.risk.low_resolved{background:var(--ok-bg);color:var(--ok)}
.risk.low_escalated{background:#e0f4f4;color:var(--accent)}
.risk.high{background:var(--warn-bg);color:var(--warn)}
.risk.blocked{background:var(--bad-bg);color:var(--bad)}
.risk.pending{background:var(--chip);color:var(--muted)}
.case .outcome{font-size:12px;margin-top:5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.reason{font-size:12px;color:var(--muted);margin-top:4px}
.devpanel{margin:10px 12px;border:1px dashed #b9c7da;border-radius:10px;padding:10px 12px;background:#fbfcfe;font-size:12.5px}
.devpanel b{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.devpanel .kv{margin-top:6px}
.shadowbox{border:1px dashed #b9c7da;background:#fbfcfe}
.sent{background:var(--ok-bg);border:1px solid #bfe5cf;border-radius:10px;padding:12px 14px;font-size:15px;line-height:1.6}
.tabs{display:flex;position:sticky;top:0;background:var(--panel);z-index:2;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:transparent;padding:11px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;border-bottom:2px solid transparent}
.tabs button.on{color:var(--brand-2);border-bottom-color:var(--brand-2)}
.tabs .n{display:inline-block;min-width:18px;padding:0 5px;margin-left:4px;border-radius:999px;background:var(--chip);color:var(--brand);font-size:11px}
.pager{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-size:12px;color:var(--muted)}
.pager button{padding:4px 10px;font-size:12px}
.pager button:disabled{opacity:.4;cursor:default}
.listnote{padding:10px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line)}
.preview{font-size:12.5px;color:var(--ok);margin-top:4px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.preview.none{color:var(--muted)}
.gear{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:999px;padding:4px 12px;font-size:13px}
.settings{position:fixed;top:52px;right:18px;width:300px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(15,27,45,.18);padding:14px;z-index:10}
.settings h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.settings .group{margin-bottom:14px}
.settings .modes{background:var(--chip);display:flex}
.settings .modes button{color:var(--brand);flex:1;white-space:nowrap;padding:4px 8px}
.settings .modes button.on{background:var(--brand-2);color:#fff}
.settings .modehint{font-size:12px;color:var(--muted);margin-top:6px}
.settings .devtoggle{font-size:13px}
.vote{font-size:18px;padding:5px 12px}
.vote.on{background:var(--chip);border-color:var(--brand-2)}
.sent.rtl{direction:rtl;text-align:right;font-family:"IBM Plex Sans Arabic",Inter,sans-serif}
/* control room (dev mode) */
#devnav{display:none}
body.dev #devnav{display:flex;flex-direction:column;position:fixed;top:48px;left:0;bottom:0;width:212px;background:var(--panel);border-right:1px solid var(--line);z-index:3;overflow:auto}
body.dev main,body.dev #screen{margin-left:212px}
body.dev.screen-on main{display:none}
#screen{display:none}
body.dev.screen-on #screen{display:block;padding:16px 22px 40px;height:calc(100vh - 48px);overflow:auto}
#devnav .grp{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);padding:14px 16px 4px}
#devnav a{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;color:var(--ink);text-decoration:none;font-size:13.5px;cursor:pointer;border-left:3px solid transparent}
#devnav a:hover{background:#f8fafc}
#devnav a.on{background:#eaf2fd;border-left-color:var(--brand-2);font-weight:600}
#devnav a i{font-style:normal;font-size:11px;background:var(--chip);color:var(--brand);border-radius:999px;padding:0 7px;font-weight:500}
#devnav .foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
#devnav .foot input{width:100%;margin:4px 0 8px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px}
#screen h1{font-size:19px;margin:0}
#screen .lead{color:var(--muted);font-size:13px;margin:3px 0 14px;max-width:820px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:14px}
.panel h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px}
.grid-t{width:100%;border-collapse:collapse;font-size:13px}
.grid-t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line);font-weight:600}
.grid-t td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.grid-t tr:last-child td{border-bottom:0}
.grid-t .d{color:var(--muted);font-size:12px;margin-top:2px}
.clip{max-width:340px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sev{font-size:11px;padding:1px 8px;border-radius:999px;font-weight:600;white-space:nowrap}
.sev.block{background:var(--bad-bg);color:var(--bad)} .sev.warn{background:var(--warn-bg);color:var(--warn)}
.sev.off{background:#eef0f3;color:var(--muted)} .sev.pass{background:var(--ok-bg);color:var(--ok)} .sev.role{background:#eaf2fd;color:var(--brand-2)}
.sw{position:relative;display:inline-block;width:34px;height:19px;flex:none}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#c5ced9;border-radius:999px;cursor:pointer;transition:.15s}
.sw span:before{content:"";position:absolute;width:15px;height:15px;left:2px;top:2px;background:#fff;border-radius:50%;transition:.15s}
.sw input:checked+span{background:var(--ok)} .sw input:checked+span:before{transform:translateX(15px)}
.sw input:disabled+span{cursor:not-allowed;opacity:.55}
.sw input:focus-visible+span{box-shadow:0 0 0 3px #dbe8fb}
select.s,input.s,textarea.s{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:inherit;font-size:13px;background:#fff}
textarea.s{width:100%;min-height:70px;resize:vertical}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px 12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.form label.w2{grid-column:span 2} .form label.w4{grid-column:span 4}
.form .s{width:100%;color:var(--ink)}
.lnk{color:var(--brand-2);background:none;border:0;padding:0 6px 0 0;font-size:12.5px;cursor:pointer}
.lnk.bad{color:var(--bad)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:26px;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.hbar{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;font-size:13px;padding:4px 0}
.hbar .t{background:#eef2f7;border-radius:4px;height:14px;overflow:hidden}
.hbar .f{height:100%;background:var(--brand-2);border-radius:0 4px 4px 0;min-width:2px}
.hbar .v{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
.cols{display:flex;align-items:flex-end;gap:10px;height:150px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.cols .c{flex:1;max-width:60px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:default}
.cols .c div{width:100%;background:var(--brand-2);border-radius:4px 4px 0 0;min-height:2px}
.cols .c:hover div{background:var(--brand)}
.cols .c small{font-size:11px;color:var(--ink);margin-bottom:3px;font-variant-numeric:tabular-nums}
.xlab{display:flex;gap:10px;padding:4px}
.xlab span{flex:1;max-width:60px;text-align:center;font-size:11px;color:var(--muted)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:#eaf2fd;color:var(--brand);font-size:13px;margin-bottom:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.chain{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px}
.chain .node{border:1px solid var(--line);border-radius:10px;padding:8px 12px;background:#fff}
.chain .node.down{border-color:var(--bad);background:var(--bad-bg);text-decoration:line-through}
.chain .node.live{border-color:var(--ok);background:var(--ok-bg)}
.note-l{font-size:12px;color:var(--muted);margin-top:4px}
.check.off .i{color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="logo">Nova Bank <span>· Agent Console</span></div>
  <div class="sp"></div>
  <div class="pill" id="today-pill"></div>
  <div class="pill">Agent: Sara (agent-07)</div>
  <div class="pill" id="mode-pill"></div>
  <button class="gear" id="gear" aria-haspopup="true" aria-expanded="false">⚙ Settings</button>
</header>
<div class="settings" id="settings" hidden>
  <div class="group"><h4>Agent mode</h4>
    <div class="modes" id="modes" role="tablist" aria-label="Copilot mode">
      <button data-mode="shadow">Shadow</button><button data-mode="copilot">Copilot</button><button data-mode="auto">Auto-reply</button>
    </div>
    <div class="modehint" id="modehint"></div></div>
  <div class="group"><h4>Developer</h4>
    <label class="devtoggle"><input type="checkbox" id="devtoggle"> Dev mode: control room (guardrails, golden rules, evals, models, analytics)</label></div>
  <div class="group devonly" style="margin-bottom:0"><h4>Demo</h4>
    <button id="reset">Reset demo: reopen every case</button></div>
</div>
<main>
  <section class="col" id="queue-col">
    <div class="tabs" role="tablist"><button data-tab="open">Open<span class="n" id="n-open">0</span></button>
      <button data-tab="closed">Closed<span class="n" id="n-closed">0</span></button></div>
    <div class="devpanel devonly" id="devpanel"></div>
    <div id="queue"></div>
    <div class="pager" id="pager" hidden><button id="prev">‹ Prev</button><span id="pageinfo"></span><button id="next">Next ›</button></div>
  </section>

  <section class="col center">
    <div class="convo" id="convo"><div class="empty">Pick a case from the queue.</div></div>
    <div class="draft" id="draft"></div>
  </section>

  <section class="col" id="customer"><h2>Verified customer</h2></section>
</main>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LANG = {en:"English", ar:"Formal Arabic", arz:"Egyptian Arabic", franco:"Franco-Arabic"};
const ACTION = {open_dispute:"Open dispute", block_card:"Block card", order_replacement_card:"Order replacement card",
  request_fee_waiver:"Request fee waiver", log_complaint:"Log complaint", escalate_to_supervisor:"Escalate to supervisor",
  refer_to_credit_team:"Refer to Credit team"};
const APPROVER = {agent:"Agent clicks", team_leader:"Team Leader approves", operations_manager:"Ops Manager approves",
  disputes_team:"Disputes team decides", credit_team:"Credit team decides"};
const TEAM = {agent:"agent", team_leader:"Team Leader", operations_manager:"Operations Manager", disputes_team:"Disputes team", credit_team:"Credit team"};
const FLAG = {prompt_injection:"Prompt injection", third_party_request:"Asks about someone else", approval_request:"Asks for approval",
  complaint:"Complaint", fraud_suspected:"Fraud suspected", card_or_fraud:"Lost card or fraud", outside_policy:"Outside policy"};
const RISK = {low_resolved:"Low · resolved", low_escalated:"Low · escalated", high:"High · needs approval", blocked:"Blocked", pending:"Assessing…"};
const OUTCOME_TEXT = {resolved:"Resolved by copilot", escalated:"Escalated by copilot", awaiting_approval:"Needs your approval", needs_agent:"Needs an agent", approved:"Approved by you"};
const OUTCOME_ORDER = {awaiting_approval:0, needs_agent:1, approved:2, escalated:3, resolved:4};
const MODE_PILL = {shadow:"Copilot shadowing · agent replies", copilot:"Copilot on · suggestions only", auto:"Auto-reply · high risk needs approval"};

// localStorage can be blocked (locked-down browsers); the console must still work, just without remembering
const store = {get: k => { try { return localStorage.getItem(k); } catch { return null; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }};
let cases = [], current = null, detail = null;
let mode = store.get("nova.mode") || "copilot";
let openedAt = 0, sourcesOpened = 0;
const auto = {};     // case_id -> /auto response, or {pending:true}
const shadow = {};   // case_id -> promise of the hidden draft
const risks = {};    // case_id -> risk label seen in this session (any mode)
const drafts = {};   // case_id -> copilot draft the agent asked for (copilot mode)
let closed = {};     // case_id -> closed info for the current mode (from the audit log)
let tab = "open", page = 0, generation = 0;  // generation: bumped on demo reset so older answers are ignored
const PAGE = 5;
const MODE_HINT = {shadow:"The copilot drafts silently; the agent writes every reply.",
  copilot:"Phase 1: the agent clicks Ask copilot for a draft, edits, and sends.",
  auto:"Phase 2 preview: the copilot closes low-risk cases; you approve the rest."};
const BY = {agent:"Sent by you", approved:"Approved by you", copilot:"Closed by copilot"};

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",3600); }
const rtl = lang => lang==="ar"||lang==="arz";
// keep dates and amounts left-to-right inside Arabic text (2026-10-15 would otherwise render reversed)
const bidi = (text, lang) => rtl(lang) ? esc(text).replace(/(\d[\d\-.,:\/]*\d|\d)/g, '<bdi dir="ltr">$1</bdi>') : esc(text);
const post = async (path, body) => {
  const r = await fetch(path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body || {})});
  const data = await r.json();
  if(!r.ok) throw new Error(data.detail || "request failed");
  return data;
};
const riskBadge = r => r ? `<span class="risk ${r.level}" title="${esc(r.reason || "")}">${RISK[r.level]}</span>` : "";
const handleSeconds = () => Math.round((Date.now() - openedAt) / 100) / 10;

// ---- header: mode switcher, dev mode, today -------------------------------------------------
async function setMode(m){
  mode = m; store.set("nova.mode", m); page = 0;
  document.querySelectorAll("#modes button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("#mode-pill").textContent = MODE_PILL[m];
  $("#modehint").textContent = MODE_HINT[m];
  await refreshClosed();
  if(mode !== m) return;  // switched again while loading
  if(m === "auto") runAuto();
  if(current) openCase(current);
}
let closedSeq = 0;
async function refreshClosed(){
  const m = mode, seq = ++closedSeq;
  let rows;
  try{ rows = await (await fetch(`/api/closed?mode=${m}`)).json(); } catch { return; }
  if(seq !== closedSeq || m !== mode) return;  // a newer refresh or another mode owns the list
  closed = Object.fromEntries(rows.map(c => [c.case_id, c]));
  renderQueue();
}
$("#gear").onclick = e => { e.stopPropagation(); const s = $("#settings"); s.hidden = !s.hidden; $("#gear").setAttribute("aria-expanded", !s.hidden); };
const closeSettings = () => { $("#settings").hidden = true; $("#gear").setAttribute("aria-expanded", "false"); };
document.addEventListener("click", e => { if(!$("#settings").hidden && !$("#settings").contains(e.target) && e.target !== $("#gear")) closeSettings(); });
document.addEventListener("keydown", e => { if(e.key === "Escape") closeSettings(); });
document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { tab = b.dataset.tab; page = 0; renderQueue(); });
$("#prev").onclick = () => { page--; renderQueue(); };
$("#next").onclick = () => { page++; renderQueue(); };
$("#reset").onclick = async () => {
  if(!confirm("Reopen every case in all three modes? The audit log keeps the history.")) return;
  try{ await post("/api/demo/reset"); } catch(e){ toast(`Reset failed: ${e.message}`); return; }
  generation++;
  for(const o of [auto, shadow, risks, drafts]) Object.keys(o).forEach(k => delete o[k]);
  current = null; $("#convo").innerHTML = `<div class="empty">Pick a case from the queue.</div>`; $("#draft").innerHTML = "";
  $("#settings").hidden = true; toast("Demo reset: every case is open again.");
  setMode(mode); refreshDev();
};
document.querySelectorAll("#modes button").forEach(b => b.onclick = () => setMode(b.dataset.mode));
$("#devtoggle").checked = store.get("nova.dev") === "1";
document.body.classList.toggle("dev", $("#devtoggle").checked);
$("#devtoggle").onchange = e => {
  store.set("nova.dev", e.target.checked ? "1" : "0"); document.body.classList.toggle("dev", e.target.checked);
  if(e.target.checked){ $("#settings").hidden = true; go(screen); } else document.body.classList.remove("screen-on");
  refreshDev();
};
fetch("/api/today").then(r => r.json()).then(d => $("#today-pill").textContent = "Today: " + d.today);

async function refreshDev(){
  if(!document.body.classList.contains("dev")) return;
  let s;
  try{ s = await (await fetch("/api/dev/summary")).json(); } catch { return; }
  const modes = Object.entries(s.sends_by_mode).map(([m,n]) => `${m} ${n}`).join(" · ") || "none yet";
  const handle = Object.entries(s.avg_handle_s_by_mode).map(([m,v]) => `${m} ${v}s`).join(" · ") || "none yet";
  $("#devpanel").innerHTML = `<b>Dev mode · AI PM and engineer · whole audit log</b>
    <div class="kv"><div>Drafts</div><div>${s.drafts} · ${s.blocked} blocked</div>
      <div>Avg latency / cost</div><div>${s.avg_latency_s}s · $${s.avg_cost_usd}</div>
      <div>Sends by mode</div><div>${modes}</div>
      <div>Avg handle time</div><div>${handle}</div>
      <div>Draft changed</div><div>${s.edit_share_pct}% on average</div>
      <div>Blind sends</div><div>${s.blind_send_pct}% sent unedited, no source opened</div>
      <div>Sources opened</div><div>${s.source_opens}</div>
      <div>Auto reviews</div><div>👍 ${s.auto_reviews.up} · 👎 ${s.auto_reviews.down} <span class="hint">(since last demo reset)</span></div>
      <div>Auto-reply</div><div>${s.auto.resolved} resolved · ${s.auto.escalated} escalated · ${s.auto.awaiting_approval} awaiting · ${s.auto.needs_agent} to agent</div></div>`;
}

// ---- queue ------------------------------------------------------------------------------------
async function loadQueue(){
  cases = await (await fetch("/api/cases")).json();
  setMode(mode);
  refreshDev();
}

// Open: shadow and copilot = every case still waiting for the agent; auto = only cases waiting for a human.
const NEEDS_HUMAN = new Set(["awaiting_approval", "needs_agent"]);
function openList(){
  const open = cases.filter(c => !closed[c.case_id]);
  if(mode !== "auto") return open;
  return open.filter(c => NEEDS_HUMAN.has(auto[c.case_id]?.outcome))
             .sort((a,b) => OUTCOME_ORDER[auto[a.case_id].outcome] - OUTCOME_ORDER[auto[b.case_id].outcome]);
}
const fmtTime = ts => new Date(ts).toLocaleString(undefined, {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"});
function renderQueue(){
  document.querySelectorAll(".tabs button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const openCases = openList();
  const closedCases = Object.values(closed).map(x => cases.find(c => c.case_id === x.case_id)).filter(Boolean);
  $("#n-open").textContent = openCases.length; $("#n-closed").textContent = closedCases.length;
  let list = tab === "open" ? openCases : closedCases, note = "";
  if(tab === "open" && mode === "auto"){
    const pending = cases.filter(c => auto[c.case_id]?.pending).length;
    if(pending) note = `<div class="listnote"><span class="spinner" style="border-color:#c9d6e6;border-top-color:var(--brand-2)"></span> Copilot assessing ${pending} case${pending>1?"s":""}…</div>`;
  }
  const pages = Math.max(1, Math.ceil(list.length / PAGE));
  $("#pager").hidden = tab !== "closed" || list.length <= PAGE;
  if(tab === "closed"){
    page = Math.min(page, pages - 1);
    list = list.slice(page * PAGE, page * PAGE + PAGE);
    $("#pageinfo").textContent = `Page ${page + 1} of ${pages}`;
    $("#prev").disabled = page === 0; $("#next").disabled = page >= pages - 1;
  }
  const empty = tab === "open" ? (mode === "auto" ? "Nothing needs your approval." : "No open cases. Nice work.") : "No closed cases yet.";
  $("#queue").innerHTML = note + (list.length ? "" : `<div class="empty" style="margin-top:30px">${empty}</div>`) + list.map(c => {
    const a = auto[c.case_id], k = closed[c.case_id];
    let line = "";
    if(k){
      const rv = k.review ? (k.review.vote === "up" ? " · 👍" : " · 👎") : (k.by === "copilot" ? ` · <span style="color:var(--warn)">needs review</span>` : "");
      line = `${a?.risk && mode === "auto" ? riskBadge(a.risk) : ""}<span class="hint">${BY[k.by]}${k.outcome ? " · " + k.outcome : ""} · ${fmtTime(k.at)}${rv}</span>`;
    }
    else if(mode === "auto" && a) line = `${riskBadge(a.risk)} <span class="hint">${OUTCOME_TEXT[a.outcome]}</span>`;
    else if(mode === "copilot" && drafts[c.case_id]) line = `${riskBadge(drafts[c.case_id].risk)}<span class="tag" style="background:var(--ok-bg);color:var(--ok)">Draft ready</span>`;
    const dr = drafts[c.case_id];
    const preview = mode === "copilot" && !k ? (dr
      ? `<div class="preview" ${dr.draft.customer_language !== "en" ? 'dir="rtl"' : ''}>↳ ${esc(dr.reply)}</div>`
      : `<div class="preview none">No draft yet</div>`) : "";
    return `<div class="case ${c.case_id===current?"active":""}" data-id="${c.case_id}">
      <div class="top"><span>${esc(c.customer_name)}</span><span class="hint">${c.channel==="call"?"📞 Call":"💬 Chat"}</span></div>
      <div class="meta">${c.case_id} · ${esc(c.plan)} · <span class="tag">${LANG[c.language]}</span></div>
      <div class="msg" ${rtl(c.language)?'dir="rtl"':''}>${esc(c.message)}</div>
      ${preview}
      ${line ? `<div class="outcome">${line}</div>` : ""}
    </div>`;}).join("");
  document.querySelectorAll(".case").forEach(el => el.onclick = () => openCase(el.dataset.id));
}

// Auto-reply: assess every case in parallel; each card updates as its answer comes back.
function runAuto(){
  cases.forEach(c => {
    if(auto[c.case_id] || closed[c.case_id]) return;
    auto[c.case_id] = {pending:true};
    const gen = generation;
    post(`/api/cases/${c.case_id}/auto`).then(r => { if(gen !== generation) return; auto[c.case_id] = r; risks[c.case_id] = r.risk; })
      .catch(e => { if(gen !== generation) return; auto[c.case_id] = {outcome: "needs_agent", error: e.message}; })
      .finally(async () => { if(gen !== generation) return; if(mode === "auto"){ await refreshClosed(); if(current === c.case_id) openCase(c.case_id); } refreshDev(); });
  });
  renderQueue();
}

// ---- case view --------------------------------------------------------------------------------
async function openCase(id){
  if(id !== current){ openedAt = Date.now(); sourcesOpened = 0; }
  current = id;
  document.querySelectorAll(".case").forEach(el => el.classList.toggle("active", el.dataset.id===id));
  detail = await (await fetch(`/api/cases/${id}`)).json();
  const c = detail.case;
  const bubble = `<div class="who">Customer · ${c.channel==="call"?"call, typed by the agent":"chat"} · ${LANG[c.language]}</div>
    <div class="bubble ${rtl(c.language)?"rtl":""}">${esc(c.message)}</div>`;
  renderCustomer([]);
  if(closed[id]) return openClosed(id, bubble);
  if(mode === "shadow") return openShadow(id, bubble);
  if(mode === "auto") return openAuto(id, bubble);
  $("#convo").innerHTML = bubble + `
    <textarea id="msg" placeholder="Edit or type what the customer says…">${esc(c.message)}</textarea>
    <div class="row"><button class="primary" id="ask">Ask copilot</button>
      <span class="hint devonly">The copilot only sees this customer's records and Nova policies. Try to break it.</span></div>`;
  $("#ask").onclick = ask;
  $("#draft").innerHTML = "";
  if(drafts[id]) renderDraft(drafts[id]);
}

// Closed: read-only record of what went out; in auto-reply the agent reviews what the copilot closed on its own.
function openClosed(id, bubble){
  const k = closed[id], a = auto[id];
  $("#convo").innerHTML = bubble;
  if(mode === "auto" && a?.result && k.by !== "agent") openAuto(id, bubble);
  else {
    const first = detail.customer.name.split(" ")[0], ar = detail.case.language !== "en";
    const text = (k.reply || "").replaceAll("{{FIRST_NAME}}", first);
    $("#draft").innerHTML = `<div class="row" style="margin-top:0"><span class="status ready">✓ ${BY[k.by]}</span>
        ${k.outcome ? `<span class="tag">${k.outcome}</span>` : ""}<span class="hint">${fmtTime(k.at)}</span></div>
      <div class="card"><h3>Reply sent to the customer · as stored in the audit log (masked)</h3>${text ? `<div class="sent ${ar?"rtl":""}">${bidi(text, ar?"ar":"en")}</div>` : `<span class="hint">No reply text in the log.</span>`}</div>`;
  }
  if(k.by === "copilot") $("#draft").insertAdjacentHTML("afterbegin", reviewHtml(k));
  bindReview(id);
}
function reviewHtml(k){
  const v = k.review?.vote;
  return `<div class="card" style="margin-top:0;margin-bottom:12px"><h3>Review the copilot · logged for the evals</h3>
    <div class="row" style="margin-top:0"><button class="vote ${v==="up"?"on":""}" data-vote="up" aria-label="Good reply">👍</button>
      <button class="vote ${v==="down"?"on":""}" data-vote="down" aria-label="Bad reply">👎</button>
      <span class="hint">${v ? `You rated this ${v === "up" ? "good" : "wrong"}${k.review.note ? ": " + esc(k.review.note) : ""}. Click to change.` : "Was this the right reply and outcome?"}</span></div>
    <div class="row" id="down-box" hidden><input class="note" id="down-note" placeholder="What was wrong?"><button id="down-submit">Submit</button></div></div>`;
}
function bindReview(id){
  const send = async (vote, note = "") => {
    try{ await post(`/api/cases/${id}/review`, {vote, note}); } catch(e){ toast(`Not logged: ${e.message}`); return; }
    toast(vote === "up" ? "Logged 👍 for the evals." : "Logged 👎 with your note for the weekly review.");
    await refreshClosed(); refreshDev(); if(current === id) openCase(id);
  };
  document.querySelectorAll("[data-vote]").forEach(b => b.onclick = () => {
    if(b.dataset.vote === "up") return send("up");
    $("#down-box").hidden = false; $("#down-note").focus();
  });
  $("#down-submit") && ($("#down-submit").onclick = () => {
    const note = $("#down-note").value.trim();
    if(!note){ $("#down-note").focus(); return; }
    send("down", note);
  });
}

function openShadow(id, bubble){
  // The copilot drafts in the background; the agent never sees it. Their send is logged next to it.
  if(!shadow[id]) shadow[id] = post(`/api/cases/${id}/suggest`, {message: detail.case.message}).catch(e => ({error: e.message}));
  $("#convo").innerHTML = bubble + `
    <div class="card"><h3>Your reply</h3>
      <textarea id="own" placeholder="Write your reply to the customer…" style="min-height:110px;margin-top:0"></textarea>
      <div class="row"><button class="primary" id="send-own">Send reply</button>
        <span class="hint">Shadow mode: the copilot is drafting silently, so the pilot can compare its draft with yours.</span></div></div>`;
  $("#draft").innerHTML = `<div class="card shadowbox devonly"><h3>Shadow draft · the agent can't see this</h3><div id="shadow-draft" class="hint">Drafting…</div></div>`;
  shadow[id].then(d => {
    // shadow mode: the agent must not see the copilot's view, so its risk label stays out of the queue
    if(current !== id || mode !== "shadow" || !$("#shadow-draft")) return;
    if(d.error){ $("#shadow-draft").textContent = "Copilot unavailable: " + d.error; return; }
    const lang = d.draft.customer_language === "en" ? "en" : "ar";
    $("#shadow-draft").innerHTML = `<div class="row" style="margin-top:0">${riskBadge(d.risk)}<span class="tag">${d.draft.intent.replaceAll("_"," ")}</span></div>
      <div class="reply ${rtl(lang)?"rtl":""}" style="margin-top:8px">${bidi(d.reply, lang)}</div><div class="en">EN: ${esc(d.reply_in_english)}</div>
      <div class="metrics"><span>⏱ ${d.latency_s ?? "-"}s</span><span>💵 $${(d.cost_usd ?? 0).toFixed(4)}</span></div>`;
  });
  $("#send-own").onclick = async () => {
    const text = $("#own").value.trim();
    if(!text){ $("#own").focus(); return; }
    const d = await shadow[id];
    const drafted = d && !d.error ? d.reply : "";
    let r;
    try{ r = await post(`/api/cases/${id}/send`, {drafted_reply: drafted, final_reply: text, mode: "shadow",
                                                  sources_opened: 0, handle_s: handleSeconds()}); }
    catch(e){ toast(`Not sent: ${e.message}`); return; }
    toast(drafted ? `Sent. Your reply differs from the copilot's hidden draft by ${r.changed_pct}%; both logged with your handle time.`
                  : "Sent and logged with your handle time (no copilot draft to compare).");
    await refreshClosed(); openCase(id);
    refreshDev();
  };
}

function openAuto(id, bubble){
  $("#convo").innerHTML = bubble;
  const a = auto[id];
  if(!a || a.pending){ $("#draft").innerHTML = `<div class="empty">The copilot is assessing this case…</div>`; if(!a) runAuto(); return; }
  if(a.outcome === "needs_agent" && (a.error || a.result.status !== "ready")) return manualReply(id, a);
  if(a.outcome === "awaiting_approval" || a.outcome === "needs_agent") return renderDraft(a.result, {approve: a.outcome === "awaiting_approval"});
  // resolved or escalated by the copilot: read-only record of what went out
  const d = a.result, lang = d.draft.customer_language === "en" ? "en" : "ar";
  $("#draft").innerHTML = `
    <div class="row" style="margin-top:0">${riskBadge(d.risk)}<span class="status ready">✓ ${OUTCOME_TEXT[a.outcome]}</span>
      <span class="tag">${d.draft.intent.replaceAll("_"," ")}</span>
      ${d.replayed ? `<span class="tag" style="background:var(--warn-bg);color:var(--warn)">Offline: replayed saved draft</span>` : ""}</div>
    <div class="reason devonly">Risk rule: ${esc(d.risk.reason)}</div>
    <div class="card"><h3>${a.outcome === "approved" ? "Reply you approved" : "Reply the copilot sent"}</h3><div class="sent ${rtl(lang)?"rtl":""}">${bidi(d.reply, lang)}</div>
      <div class="en">EN: ${esc(d.reply_in_english)}</div></div>
    ${a.actions.length ? `<div class="card"><h3>${a.outcome === "approved" ? "Actions submitted" : "Handed over · a human team decides"}</h3>${a.actions.map(x => `
      <div class="action"><div><b>${ACTION[x.action]}</b></div><span class="approver">${APPROVER[x.approver]}</span></div>`).join("")}</div>` : ""}
    <div class="card"><h3>Claims and sources</h3>${factsHtml(d.draft)}</div>
    <div class="hint" style="margin-top:10px">${a.outcome === "approved" ? "You approved this case; each action went to the approver Nova's policy names." :
      `Nothing that moves money happens without a human. This case only needed information${a.actions.length ? " and a hand-over" : ""}.`}</div>`;
  renderCustomer(citedIds(d.draft));
  bindCites();
}

// The copilot failed or its draft was blocked: the agent answers this case themselves, and it closes on send.
function manualReply(id, a){
  const why = a.error ? `Copilot unavailable: ${esc(a.error)}` : "The copilot's draft was blocked by a guardrail, so it is hidden.";
  $("#draft").innerHTML = `<div class="row" style="margin-top:0">${a.risk ? riskBadge(a.risk) : ""}<span class="status blocked">Needs an agent</span></div>
    <div class="card"><h3>Your reply</h3><p class="hint" style="margin-top:0">${why} Answer from the policy yourself or escalate.</p>
      <textarea id="own" placeholder="Write your reply to the customer…" style="min-height:110px;margin-top:0"></textarea>
      <div class="row"><button class="primary" id="send-own">Send reply</button>${a.error ? `<button id="retry">Ask the copilot again</button>` : ""}</div></div>`;
  $("#retry") && ($("#retry").onclick = () => { delete auto[id]; runAuto(); openCase(id); });
  $("#send-own").onclick = async () => {
    const text = $("#own").value.trim();
    if(!text){ $("#own").focus(); return; }
    $("#send-own").disabled = true;
    try{ await post(`/api/cases/${id}/send`, {drafted_reply: "", final_reply: text, mode: "auto", sources_opened: sourcesOpened, handle_s: handleSeconds()}); }
    catch(e){ $("#send-own").disabled = false; toast(`Not sent: ${e.message}`); return; }
    toast("Sent and logged with your handle time.");
    await refreshClosed(); openCase(id); refreshDev();
  };
}

function renderCustomer(cited){
  const cu = detail.customer, citedSet = new Set(cited);
  const disputes = detail.disputes.map(d => `<tr class="${citedSet.has(d.dispute_id)?"hl":""}"><td><b>${d.dispute_id}</b> · ${esc(d.merchant)}<br>
      <span class="st ${d.stage}">${d.stage.replaceAll("_"," ")}</span> <span class="hint">expected by ${d.expected_resolution_by}</span></td>
      <td class="amt">EGP ${Number(d.amount).toLocaleString()}</td></tr>`).join("") || `<tr><td class="hint">No disputes</td></tr>`;
  const txns = detail.transactions.slice(0, 40).map(t => `<tr class="${citedSet.has(t.txn_id)?"hl":""}" id="row-${t.txn_id}">
      <td>${t.date.slice(5)} · ${esc(t.merchant)} ${t.status!=="posted"?`<span class="st ${t.status}">${t.status}</span>`:""}<br><span class="hint">${t.txn_id}</span></td>
      <td class="amt">${Number(t.amount).toLocaleString(undefined,{minimumFractionDigits:2})}</td></tr>`).join("");
  $("#customer").innerHTML = `<h2>Verified customer</h2>
    <div class="cust"><div class="name">${esc(cu.name)}</div><div class="verified">✓ Verified (ID&amp;V passed) · ${cu.customer_id}</div>
      <div class="kv"><div>Plan</div><div>${esc(cu.plan)}</div><div>Tenure</div><div>${cu.tenure_months} months</div>
        <div>City</div><div>${esc(cu.city)}</div><div>Card</div><div>•••• ${cu.card_last4} · ${cu.card_status.replaceAll("_"," ")}</div>
        <div>Mobile</div><div>${cu.mobile}</div></div></div>
    <div class="policy" id="policy"></div>
    <div class="sub">Disputes</div><table>${disputes}</table>
    <div class="sub">Transactions</div><table>${txns}</table>`;
}

async function ask(){
  const id = current;  // the agent may open another case while this one drafts
  const btn = $("#ask"); btn.disabled = true; btn.innerHTML = `<span class="spinner"></span> Drafting…`;
  $("#draft").innerHTML = `<div class="empty">Reading policies and this customer's records…</div>`;
  try{
    const data = await post(`/api/cases/${id}/suggest`, {message:$("#msg").value});
    risks[id] = data.risk; drafts[id] = data; renderQueue();
    if(current === id && mode === "copilot") renderDraft(data);
  }catch(e){ if(current === id) $("#draft").innerHTML = `<div class="card"><span class="status blocked">Copilot unavailable</span><p>${esc(e.message)}</p><p class="hint">Answer the customer manually.</p></div>`; }
  const b = $("#ask"); if(b && current === id){ b.disabled = false; b.textContent = "Ask copilot"; }
  refreshDev();
}

const citedIds = dr => dr.facts.flatMap(f => f.citations.map(c => c.source_id.trim()));
const factsHtml = dr => dr.facts.map(f => `<div class="fact">${esc(f.statement)}<br>
  ${f.citations.map(c => `<span class="cite" data-src="${esc(c.source_id.trim())}" title="${esc(c.quote)}">${esc(c.source_id)}</span>`).join("")}</div>`).join("") || `<span class="hint">No claims.</span>`;
function bindCites(){ document.querySelectorAll(".cite").forEach(el => el.onclick = () => showSource(el.dataset.src, el.title)); }

function checksHtml(d){
  const failed = d.checks.filter(c => !c.passed);
  const row = c => { const cls = c.severity==="off" ? "off" : c.passed ? "pass" : (c.severity==="warn" ? "warn" : "fail");
    return `<div class="check ${cls}"><span class="i">${c.severity==="off"?"○":c.passed?"✓":(c.severity==="warn"?"!":"✕")}</span><div>${esc(c.name)}<div class="d">${esc(c.detail)}</div></div></div>`; };
  const summary = `<div class="check ${failed.length ? "fail" : "pass"}"><span class="i">${failed.length ? "✕" : "✓"}</span><div>${d.checks.length - failed.length}/${d.checks.length} checks passed</div></div>`;
  // agents see one line unless something failed; dev mode shows the full list
  return `<div class="card"><h3>Guardrail checks</h3>${failed.length ? failed.map(row).join("") : summary}
    <div class="devonly">${d.checks.filter(c => c.passed).map(row).join("")}</div>
    ${d.retried ? `<div class="hint" style="margin-top:6px">First draft failed a check; the copilot corrected it once.</div>` : ""}</div>`;
}

function renderDraft(d, opts = {}){
  const dr = d.draft, lang = dr.customer_language === "en" ? "en" : "ar";  // replies are formal Arabic or formal English
  const flags = [...new Set([...d.input_flags, ...dr.risk_flags])];
  const ready = d.status === "ready";
  const sendLabel = opts.approve ? "Approve and send" : "Send reply";
  $("#draft").innerHTML = `
    <div class="row" style="margin-top:0">
      ${riskBadge(d.risk)}
      <span class="status ${d.status}">${ready ? (opts.approve ? "Waiting for your approval" : "✓ Ready to send") : "✕ Blocked by guardrails"}</span>
      <span class="tag">${dr.intent.replaceAll("_"," ")}</span>
      ${d.replayed ? `<span class="tag" style="background:var(--warn-bg);color:var(--warn)">Offline: replaying the last saved draft</span>` : ""}
      ${flags.length ? `<span class="flags">${flags.map(f=>`<span class="tag">⚠ ${FLAG[f]||f}</span>`).join("")}</span>` : ""}
    </div>
    ${d.risk ? `<div class="reason devonly">Risk rule: ${esc(d.risk.reason)}</div>` : ""}
    <div class="card"><h3>For you</h3>${esc(dr.agent_summary)}</div>
    <div class="card"><h3>Suggested reply · ${lang === "en" ? "Formal English" : "Formal Arabic"}</h3>
      ${ready ? `<div class="reply ${rtl(lang)?"rtl":""}" id="reply" contenteditable="true" spellcheck="false" aria-label="Suggested reply, click to edit">${bidi(d.reply, lang)}</div>
      <div class="row" style="margin-top:6px"><span class="hint">Click the reply to edit it. Sending or flagging logs your version next to the draft.</span>
        <span class="tag edited" id="edited-tag" hidden>Edited</span><button id="undo" hidden>Undo edits</button></div>
      <div class="en">EN: ${esc(d.reply_in_english)}</div>
      <div class="row"><button class="primary" id="send">${sendLabel}</button><button id="copy">Copy</button><button id="flag">Flag as wrong</button></div>
      ${opts.approve ? `<div class="hint">Approving sends this reply and submits the actions below to the approvers named in Nova's policy.</div>` : ""}`
      : `<p>This draft failed a check below, so it is hidden. Answer from the policy yourself or escalate.</p><button id="flag">Flag</button>`}
      <div class="row" id="flag-box" hidden><input class="note" id="flag-note" placeholder="What is wrong? If you corrected the reply above, your version is logged too.">
        <button id="flag-submit">Submit flag</button></div>
    </div>
    <div class="card"><h3>Claims and sources</h3>${factsHtml(dr)}</div>
    <div class="card"><h3>Suggested actions · nothing happens until a human approves</h3>${dr.suggested_actions.map(a => `
      <div class="action"><div><b>${ACTION[a.action]}</b><br><span class="hint">${esc(a.reason)}</span></div>
        <div class="row" style="margin:0"><span class="approver">${APPROVER[a.approver]}</span>${opts.approve ? "" :
          `<button data-act="${a.action}" data-reason="${esc(a.reason)}" data-amount="${a.amount_egp ?? ""}">${a.approver==="agent"?"Do it":"Send for approval"}</button>`}</div></div>`).join("") || `<span class="hint">No actions suggested.</span>`}</div>
    ${checksHtml(d)}
    <div class="metrics devonly"><span>⏱ ${d.latency_s ?? "-"}s</span><span>💵 $${(d.cost_usd ?? 0).toFixed(4)}</span>
      ${d.tokens ? `<span>Tokens in ${d.tokens.input.toLocaleString()} · cached ${d.tokens.cache_read.toLocaleString()} · out ${d.tokens.output.toLocaleString()}</span>` : ""}<span>${esc(d.model || "")}${d.fell_back_from ? ` · backup model: ${esc(d.fell_back_from)} failed` : ""}</span></div>`;
  renderCustomer(citedIds(dr));
  bindCites();
  document.querySelectorAll("[data-act]").forEach(el => el.onclick = () => act(el.dataset.act, el.dataset.reason, el.dataset.amount));
  // The agent can edit the reply in place; sending or flagging logs their version next to the draft for the edit-rate eval.
  const box = $("#reply"), words = s => s.trim().split(/\s+/).join(" ");
  const finalText = () => box ? box.innerText.trim() : d.reply;
  const isEdited = () => !!box && words(finalText()) !== words(d.reply);
  if(box){
    box.oninput = () => { $("#edited-tag").hidden = $("#undo").hidden = !isEdited(); };
    $("#undo").onclick = () => { box.innerHTML = bidi(d.reply, lang); box.oninput(); };
  }
  $("#send") && ($("#send").onclick = async () => {
    const btn = $("#send"); btn.disabled = true;  // one click, one send
    try{
    if(opts.approve){
      const r = await post(`/api/cases/${current}/approve`, {final_reply: finalText(), handle_s: handleSeconds(), sources_opened: sourcesOpened});
      toast(`Approved and sent. ${r.actions.map(x => x.approver === "agent" ? `${ACTION[x.action]}: done` : `${ACTION[x.action]} → ${TEAM[x.approver]}`).join("; ") || "No actions."}`);
      auto[current] = {...auto[current], outcome: "approved", actions: r.actions};
      await refreshClosed(); openCase(current);
    } else {
      const r = await post(`/api/cases/${current}/send`, {drafted_reply: d.reply, final_reply: finalText(), mode,
                                                         sources_opened: sourcesOpened, handle_s: handleSeconds()});
      toast(r.edited ? `Sent with ${r.changed_pct}% of the draft changed; both versions logged.` : "Sent as drafted and logged to the audit trail.");
      await refreshClosed(); openCase(current);
    }
    }catch(e){
      btn.disabled = false;
      toast(`Not sent: ${e.message}`);
      if(opts.approve){ delete auto[current]; runAuto(); }  // the server lost its assessment (restart): assess again
    }
    refreshDev();
  });
  $("#copy") && ($("#copy").onclick = () => { navigator.clipboard.writeText(finalText()); toast("Copied."); });
  $("#flag").onclick = () => { $("#flag-box").hidden = false; $("#flag-note").focus(); };
  $("#flag-submit").onclick = async () => {
    const note = $("#flag-note").value.trim();
    if(!note){ $("#flag-note").focus(); return; }
    const r = await post(`/api/cases/${current}/flag`, box ? {note, drafted_reply: d.reply, edited_reply: finalText()} : {note});
    $("#flag-box").hidden = true; $("#flag-note").value = "";
    toast("Flagged for weekly review (POL-20 §6)" + (r.changed_pct ? `, with your correction (${r.changed_pct}% of the draft changed).` : "."));
  };
}

async function showSource(src, quote){
  sourcesOpened++;  // Telos rec 14: was the draft checked before it was sent?
  post(`/api/cases/${current}/source_opened`, {source: src}).catch(() => {});
  const box = $("#policy");
  if(src.startsWith("POL-")){
    const [pid, sec] = src.split("§").map(s => s.trim());
    const p = await (await fetch(`/api/policies/${pid}`)).json();
    const s = p.sections[sec];
    box.innerHTML = `<b>${pid} §${sec} · ${esc(p.title)}</b><div class="hint">${esc(p.header)}</div><p>${esc(s ? s.title + ". " + s.text : "Section not found")}</p><div class="hint">Quoted: “${esc(quote)}”</div>`;
    box.style.display = "block"; box.scrollIntoView({behavior:"smooth", block:"nearest"});
  } else {
    box.style.display = "none";
    const row = document.getElementById("row-" + src);
    if(row){ row.scrollIntoView({behavior:"smooth", block:"center"}); }
    toast(`${src}: “${quote}”`);
  }
}

async function act(action, reason, amount){
  const r = await post(`/api/cases/${current}/action`, {action, reason, amount_egp: amount ? Number(amount) : null});
  toast(`${ACTION[action]}: ${r.note}`);
}

async function go(name){

function goldenForm(c){
  const o = cr.ctrl.options, opt = (xs, v) => xs.map(x => `<option ${x===v?"selected":""}>${x}</option>`).join("");
  const multi = (id, xs, sel) => `<select class="s" id="${id}" multiple size="4">${xs.map(x => `<option ${sel.includes(x)?"selected":""}>${x}</option>`).join("")}</select>`;
  $("#gc-form").innerHTML = `<div class="panel"><h2>${c.id ? `Edit ${esc(c.id)} · tighten what it requires` : "New golden case"}</h2><div class="form">
    <label>Type<select class="s" id="gf-type">${opt(o.types, c.type)}</select></label>
    <label>Intent<select class="s" id="gf-intent">${opt(o.intents, c.intent)}</select></label>
    <label>Language<select class="s" id="gf-lang">${opt(o.languages, c.language)}</select></label>
    <label>Customer<select class="s" id="gf-cust">${o.customers.map(x => `<option value="${x.id}" ${x.id===c.customer_id?"selected":""}>${x.id} · ${esc(x.name)}</option>`).join("")}</select></label>
    <label class="w4">Customer question<textarea class="s" id="gf-q">${esc(c.question || "")}</textarea></label>
    <label class="w4">Benchmark answer (ground truth)<textarea class="s" id="gf-a">${esc(c.benchmark_answer || "")}</textarea></label>
    <label class="w2">Benchmark location (sources it must cite, ; between)<input class="s" id="gf-loc" value="${esc(c.benchmark_location || "")}" placeholder="D-1001; POL-05 §4"></label>
    <label>Sources answer it?<select class="s" id="gf-found"><option value="true">Yes</option><option value="false" ${c.expect_answer_found===false?"selected":""}>No: must say so</option></select></label>
    <label>Notes<input class="s" id="gf-notes" value="${esc(c.notes || "")}"></label>
    <label class="w2">Must flag (Ctrl-click for several)${multi("gf-flag", o.flags, c.must_flag || [])}</label>
    <label class="w2">Must suggest one of${multi("gf-sug", o.actions, c.must_suggest || [])}</label></div>
    <div class="bar" style="margin:12px 0 0"><button class="primary" id="gf-save">Save case</button><button id="gf-cancel">Cancel</button>
      <span class="hint">Saved to "${esc(cr.golden.sets.find(s => s.id === cr.goldenSet).name)}". Rerun it from Evals to see the effect.</span></div></div>`;
  $("#gc-form").scrollIntoView({behavior:"smooth", block:"start"});
  $("#gf-cancel").onclick = () => $("#gc-form").innerHTML = "";
  const sel = id => [...$(id).selectedOptions].map(x => x.value);
  $("#gf-save").onclick = async () => {
    try{
      const saved = await api("POST", `/api/control/golden?set=${encodeURIComponent(cr.goldenSet)}`, {id: c.id || null, type: $("#gf-type").value,
        intent: $("#gf-intent").value, language: $("#gf-lang").value, customer_id: $("#gf-cust").value, question: $("#gf-q").value,
        benchmark_answer: $("#gf-a").value, benchmark_location: $("#gf-loc").value, expect_answer_found: $("#gf-found").value === "true",
        notes: $("#gf-notes").value, must_flag: sel("#gf-flag"), must_suggest: sel("#gf-sug")});
      toast(`${saved.id} saved.`); renderGolden(); refreshNav();
    } catch(e){ toast(e.message); }
  };
}
function uploadBatchForm(){
  $("#gc-form").innerHTML = `<div class="panel"><h2>Upload a new batch</h2>
    <p class="hint" style="margin-top:0">Use the downloaded sheet as the template (.xlsx or .csv). Leave id empty for new cases. The batch becomes its own set; pick it above and choose "Use this set for evals". If any row is invalid, nothing is uploaded and you'll see which rows to fix.</p>
    <div class="form"><label class="w2">Batch name<input class="s" id="ub-name" placeholder="e.g. Fee edge cases, week 2"></label>
      <label class="w2">File<input class="s" type="file" id="ub-file" accept=".xlsx,.csv"></label></div>
    <div class="bar" style="margin:12px 0 0"><button class="primary" id="ub-go">Upload batch</button><button id="ub-cancel">Cancel</button>
      <span class="hint">Logged as uploaded by ${esc(devUser() || "(type your name in the side menu)")} with the date and time.</span></div></div>`;
  $("#ub-cancel").onclick = () => $("#gc-form").innerHTML = "";
  $("#ub-go").onclick = async () => {
    const f = $("#ub-file").files[0];
    if(!needUser()) return;
    if(!$("#ub-name").value.trim()) return toast("Name the batch first.");
    if(!f) return toast("Choose a file first.");
    try{
      const r = await api("POST", "/api/control/golden/upload", {filename: f.name, data_b64: await fileB64(f), name: $("#ub-name").value, by: devUser()});
      cr.goldenSet = r.id; toast(`"${r.name}" uploaded: ${r.count} cases, by ${r.by}.`); renderGolden(); refreshNav();
    } catch(e){ toast(e.message); $("#gc-form .hint:last-child").textContent = e.message; }
  };
}

// ---- Evals ------------------------------------------------------------------------------------
async function renderEvals(){
  const ev = cr.evals = await api("GET", "/api/control/evals");
  const sets = (await api("GET", "/api/control/golden")).sets, set = sets.find(s => s.active);
  const last = ev.history.find(h => h.total >= ev.cases.length) || ev.history[0];
  const rows = ev.cases.map(c => ({c, r: ev.latest[c.id], n: ev.notes[c.id] || []}));
  const failing = rows.filter(x => x.r && !x.r.passed).map(x => x.c.id);
  const passN = rows.filter(x => x.r?.passed).length, ran = rows.filter(x => x.r).length;
  if(ev.running && !cr.poll) cr.poll = setInterval(() => { if(screen === "evals") renderEvals(); }, 4000);
  if(!ev.running && cr.poll){ clearInterval(cr.poll); cr.poll = null; toast("Eval run finished."); }
  const pct = v => v == null ? "-" : Math.round(v * 100) + "%";
  $("#screen").innerHTML = `<h1>Evals</h1>
    <p class="lead">Each golden case goes through the real copilot, then a judge model and code checks score it for helpfulness, honesty and harmlessness. A case passes only if it is honest, harmless, matches the benchmark and reaches the agent. Running uses the current guardrails and models, so a settings change shows up here.</p>
    ${ev.running ? `<div class="banner"><span class="spinner" style="border-color:#c9d6e6;border-top-color:var(--brand-2)"></span> Running ${ev.running_ids.length} case${ev.running_ids.length>1?"s":""} on "${esc(ev.running_set)}"… about 20 seconds a case, in parallel. This page refreshes itself.</div>`
      : ev.last_exit ? `<div class="banner warn">The last run stopped with an error. Check app/logs/eval_run.log.</div>` : ""}
    <div class="kpis"><div class="kpi"><b>${passN} / ${ev.cases.length}</b><span>cases passing (latest result each) · ${ran} run</span></div>
      <div class="kpi"><b>${pct(last?.Helpfulness)}</b><span>Helpful · last full run</span></div><div class="kpi"><b>${pct(last?.Honesty)}</b><span>Honest</span></div>
      <div class="kpi"><b>${pct(last?.Harmlessness)}</b><span>Harmless</span></div>
      <div class="kpi"><b>${last?.avg_cost_usd_per_answer != null ? "$" + last.avg_cost_usd_per_answer : "-"}</b><span>per answer · ${esc(last?.model || "")}</span></div></div>
    <div class="bar"><span class="hint">Golden set: <b>${esc(set.name)}</b> (${set.count} cases)</span>
      <button class="primary" id="ev-all" ${ev.running?"disabled":""}>▶ Run all</button>
      <button id="ev-fail" ${ev.running || !failing.length ? "disabled" : ""}>Rerun failing (${failing.length})</button>
      <span style="flex:1"></span><a href="/api/control/evals/download"><button>⬇ Download results + Notes column</button></a>
      <button id="ev-up">⬆ Upload notes</button></div>
    <div id="ev-form"></div>
    <div class="panel" style="padding:4px 8px"><table class="grid-t"><tr><th>ID</th><th>Question</th><th>Result</th><th>Why it failed</th><th>Review notes</th><th></th></tr>
    ${rows.map(({c, r, n}) => { const ln = n[n.length - 1];
      return `<tr><td><b>${esc(c.id)}</b><div class="d">${esc(c.language)}</div></td>
      <td><div class="clip" ${rtl(c.language)?'dir="rtl"':""}>${esc(c.question)}</div></td>
      <td>${ev.running_ids.includes(c.id) ? `<span class="sev role">Running…</span>` : !r ? `<span class="hint">Not run</span>`
        : `<span class="sev ${r.passed?"pass":"block"}">${r.passed?"Pass":"Fail"}</span><div class="d">${esc(r.stamp)}</div>`}</td>
      <td><div class="clip">${r && !r.passed ? esc((r.failed || []).join("; ") || r.error || r.reason) : ""}</div></td>
      <td>${ln ? `<div class="clip">${esc(ln.note)}</div><div class="d">${esc(ln.by)} · ${fmtAt(ln.at)}${n.length>1?` · ${n.length} notes`:""}</div>` : `<span class="hint">-</span>`}</td>
      <td style="white-space:nowrap"><button class="lnk" data-run="${esc(c.id)}" ${ev.running?"disabled":""}>Rerun</button><button class="lnk" data-tight="${esc(c.id)}">Tighten</button></td></tr>`; }).join("")}</table></div>
    <div class="panel"><h2>Run history</h2><table class="grid-t"><tr><th>Run</th><th>Golden set</th><th>Passed</th><th>Helpful</th><th>Honest</th><th>Harmless</th><th>Model</th></tr>
      ${ev.history.slice(0, 10).map(h => `<tr><td>${esc(h.stamp)}</td><td>${esc(h.golden_set)}</td><td>${h.passed} / ${h.total}</td><td>${pct(h.Helpfulness)}</td><td>${pct(h.Honesty)}</td><td>${pct(h.Harmlessness)}</td><td>${esc(h.model || "")}</td></tr>`).join("")}</table></div>`;
  const run = async ids => {
    if(!ids.length && !confirm(`Run all ${set.count} cases? It uses the API: roughly $${(set.count * ((last?.avg_cost_usd_per_answer || 0.04) * 2)).toFixed(2)} and a few minutes.`)) return;
    try{ const r = await api("POST", "/api/control/evals/run", {ids}); toast(`Running ${r.ids.length} case${r.ids.length>1?"s":""}…`); renderEvals(); }
    catch(e){ toast(e.message); }
  };
  $("#ev-all").onclick = () => run([]);
  $("#ev-fail").onclick = () => run(failing);
  document.querySelectorAll("[data-run]").forEach(el => el.onclick = () => run([el.dataset.run]));
  document.querySelectorAll("[data-tight]").forEach(el => el.onclick = () => { cr.goldenSet = ev.active_set; cr.editGolden = el.dataset.tight; go("golden"); });
  $("#ev-up").onclick = () => {
    $("#ev-form").innerHTML = `<div class="panel"><h2>Upload review notes</h2>
      <p class="hint" style="margin-top:0">Download the results, write in the Notes column next to each case, then upload the file here. Every note is logged with your name and the date and time.</p>
      <div class="bar" style="margin:0"><input class="s" type="file" id="en-file" accept=".xlsx,.csv"><button class="primary" id="en-go">Upload notes</button><button id="en-cancel">Cancel</button>
      <span class="hint">As ${esc(devUser() || "(type your name in the side menu)")}</span></div></div>`;
    $("#en-cancel").onclick = () => $("#ev-form").innerHTML = "";
    $("#en-go").onclick = async () => {
      const f = $("#en-file").files[0];
      if(!needUser()) return; if(!f) return toast("Choose a file first.");
      try{ const r = await api("POST", "/api/control/evals/notes", {filename: f.name, data_b64: await fileB64(f), by: devUser()});
        toast(`${r.count} note${r.count>1?"s":""} logged by ${r.by}.`); renderEvals(); }
      catch(e){ toast(e.message); }
    };
  };
}

// ---- Models -----------------------------------------------------------------------------------
async function renderModels(){
  const c = cr.ctrl = await api("GET", "/api/control");
  const prim = c.models.find(m => m.role === "primary" && m.enabled), back = c.models.find(m => m.role === "backup" && m.enabled);
  const money = p => `$${p[0]} in · $${p[1]} out`;
  $("#screen").innerHTML = `<h1>Models</h1>
    <p class="lead">The primary model drafts every reply. If it fails (outage, timeout, error), the copilot retries the same request on the backup and the draft says so in dev mode. The guardrails run the same way on either model.</p>
    <div class="panel"><h2>Right now</h2><div class="chain">
      <div class="node ${c.simulate_outage ? "down" : "live"}">Primary · ${esc(prim?.label || "none")}</div><span>→ if it fails →</span>
      <div class="node ${c.simulate_outage && back ? "live" : ""}">Backup · ${esc(back?.label || "none set")}</div>
      <span>→ if both fail, the last good draft for that case is replayed, marked as a replay</span></div>
      <div class="bar" style="margin:14px 0 0">${sw('id="m-out" aria-label="Simulate primary outage"', c.simulate_outage)}
        <b>Simulate a primary outage</b><span class="hint">Turn on, then ask the copilot on a live case: the draft comes from the backup.</span>
        <button id="m-try">Try it on a live case →</button></div></div>
    <div class="bar"><button class="primary" id="m-add">+ Add model</button></div><div id="m-form"></div>
    <div class="panel" style="padding:4px 8px"><table class="grid-t"><tr><th style="width:50px">On</th><th>Model</th><th>Role</th><th>Price per million tokens</th><th></th></tr>
    ${c.models.map(m => `<tr><td>${sw(`data-men="${esc(m.id)}" aria-label="${esc(m.label)} on or off"`, m.enabled, m.role === "primary")}</td>
      <td><b>${esc(m.label)}</b><div class="d">${esc(m.id)}</div></td>
      <td>${m.role ? `<span class="sev ${m.role==="primary"?"role":"warn"}">${m.role === "primary" ? "Primary" : "Backup"}</span>` : `<span class="hint">-</span>`}</td>
      <td>${money(m.prices)}<div class="d">cache write $${m.prices[2]} · read $${m.prices[3]}</div></td>
      <td style="white-space:nowrap">${m.role !== "primary" ? `<button class="lnk" data-mrole="${esc(m.id)}" data-r="primary">Make primary</button>` : ""}
        ${!m.role ? `<button class="lnk" data-mrole="${esc(m.id)}" data-r="backup">Set as backup</button>` : ""}
        ${m.role === "backup" ? `<button class="lnk" data-mrole="${esc(m.id)}" data-r="none">Remove as backup</button>` : ""}
        <button class="lnk" data-medit="${esc(m.id)}">Edit</button>
        ${m.role !== "primary" ? `<button class="lnk bad" data-mdel="${esc(m.id)}">Remove</button>` : ""}</td></tr>`).join("")}</table></div>`;
  $("#m-out").onchange = async e => { await api("POST", "/api/control/outage", {on: e.target.checked});
    toast(e.target.checked ? "Primary marked down: new drafts come from the backup." : "Primary is back."); renderModels(); refreshNav(); };
  $("#m-try").onclick = () => go("console");
  $("#m-add").onclick = () => modelForm({prices:[]});
  document.querySelectorAll("[data-medit]").forEach(el => el.onclick = () => modelForm(c.models.find(m => m.id === el.dataset.medit)));
  document.querySelectorAll("[data-men]").forEach(el => el.onchange = () => api("POST", `/api/control/models/${encodeURIComponent(el.dataset.men)}`, {enabled: el.checked})
    .then(() => { renderModels(); refreshNav(); }).catch(e => { toast(e.message); el.checked = !el.checked; }));
  document.querySelectorAll("[data-mrole]").forEach(el => el.onclick = () => api("POST", `/api/control/models/${encodeURIComponent(el.dataset.mrole)}`, {role: el.dataset.r})
    .then(r => { toast(`Order now: ${r.model_chain.join(" → ")}`); renderModels(); refreshNav(); }).catch(e => toast(e.message)));
  document.querySelectorAll("[data-mdel]").forEach(el => el.onclick = async () => { if(!confirm(`Remove ${el.dataset.mdel}?`)) return;
    try{ await api("DELETE", `/api/control/models/${encodeURIComponent(el.dataset.mdel)}`); renderModels(); refreshNav(); } catch(e){ toast(e.message); } });
}
function modelForm(m){
  const p = m.prices || [];
  $("#m-form").innerHTML = `<div class="panel"><h2>${m.id ? "Edit model" : "Add a model"}</h2><div class="form">
    <label class="w2">Model ID (as the API names it)<input class="s" id="mf-id" value="${esc(m.id || "")}" ${m.id?"readonly":""} placeholder="claude-sonnet-5-5"></label>
    <label class="w2">Display name<input class="s" id="mf-label" value="${esc(m.label || "")}" placeholder="Claude Sonnet 5.5"></label>
    ${["Input", "Output", "Cache write", "Cache read"].map((l, i) => `<label>${l} $ / M tokens<input class="s" type="number" min="0" step="0.01" data-mp="${i}" value="${p[i] ?? ""}"></label>`).join("")}</div>
    <div class="bar" style="margin:12px 0 0"><button class="primary" id="mf-save">Save model</button><button id="mf-cancel">Cancel</button>
      <span class="hint">Prices drive the cost shown on each draft. A new model starts with no role: make it primary or backup from the table.</span></div></div>`;
  $("#mf-cancel").onclick = () => $("#m-form").innerHTML = "";
  $("#mf-save").onclick = async () => {
    try{ await api("POST", "/api/control/models", {id: $("#mf-id").value.trim(), label: $("#mf-label").value,
           enabled: m.enabled ?? true, prices: [...document.querySelectorAll("[data-mp]")].map(x => Number(x.value))});
      toast("Model saved."); renderModels(); refreshNav(); } catch(e){ toast(e.message); }
  };
}

// ---- Analytics --------------------------------------------------------------------------------
async function renderAnalytics(){
  const a = await api("GET", "/api/control/analytics");
  const n = x => Number(x).toLocaleString(undefined, {maximumFractionDigits: 1});
  const max = Math.max(1, ...Object.values(a.auto_outcomes));
  const OUT = {resolved:"Resolved by copilot", escalated:"Escalated by copilot", awaiting_approval:"Waited for approval", needs_agent:"Sent to an agent"};
  const days = a.by_day.slice(-14), dmax = Math.max(1, ...days.map(d => d.minutes));
  const hmode = Object.entries(a.avg_handle_s_by_mode), hmax = Math.max(1, ...hmode.map(([, v]) => v));
  const MODE = {shadow:"Shadow (agent alone)", copilot:"Copilot", auto:"Auto-reply approvals"};
  $("#screen").innerHTML = `<h1>Deflection &amp; time saved</h1>
    <p class="lead">From the audit log: every chat handled in this console, in all three modes. Deflected means the copilot answered the customer on its own in auto-reply, with no human. The minutes use the assumptions at the bottom, which you can change.</p>
    <div class="kpis">
      <div class="kpi"><b>${a.deflected}</b><span>chats deflected · ${a.deflection_pct}% of ${a.assessed_by_copilot} the copilot assessed</span></div>
      <div class="kpi"><b>${n(a.minutes_saved)} min</b><span>agent minutes saved (${n(a.minutes_saved / 60)} hours)</span></div>
      <div class="kpi"><b>${n(a.minutes_per_chat)} min</b><span>saved per chat handled</span></div>
      <div class="kpi"><b>${a.chats_handled}</b><span>chats handled · ${a.assisted_sends} with a copilot draft · ${a.shadow_sends} shadow</span></div></div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px">
      <div class="panel"><h2>Auto-reply outcomes</h2>
        ${Object.entries(a.auto_outcomes).map(([k, v]) => `<div class="hbar" title="${OUT[k]}: ${v}"><span>${OUT[k]}</span><div class="t"><div class="f" style="width:${100 * v / max}%"></div></div><span class="v">${v}</span></div>`).join("")}
        <div class="note-l">Only "Resolved by copilot" counts as deflected. Escalated chats went to a human team with the copilot's reply already sent.</div></div>
      <div class="panel"><h2>Average handle time by mode (measured in this console)</h2>
        ${hmode.map(([m, v]) => `<div class="hbar" title="${MODE[m] || m}: ${v} seconds"><span>${MODE[m] || esc(m)}</span><div class="t"><div class="f" style="width:${100 * v / hmax}%"></div></div><span class="v">${v}s</span></div>`).join("") || `<p class="hint">No sends yet.</p>`}
        <div class="note-l">Demo handle times are short because the cases are scripted; the minutes saved use the ticket baseline below instead.</div></div></div>
    <div class="panel"><h2>Agent minutes saved per day</h2>
      ${days.length ? `<div class="cols">${days.map(d => `<div class="c" title="${d.day}: ${d.minutes} min · ${d.resolved} deflected · ${d.assisted} assisted · ${d.escalated} escalated"><small>${n(d.minutes)}</small><div style="height:${Math.max(2, 120 * d.minutes / dmax)}px"></div></div>`).join("")}</div>
        <div class="xlab">${days.map(d => `<span>${new Date(d.day + "T00:00").toLocaleDateString(undefined, {day:"numeric", month:"short"})}</span>`).join("")}</div>` : `<p class="hint">No chats handled yet. Send a few drafts or run auto-reply.</p>`}</div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px">
      <div class="panel"><h2>At Nova's volume</h2>
        <div class="kv"><div>In-scope chats a month</div><div><b>${n(a.projection.in_scope_chats_per_month)}</b> (${n(a.assumptions.contacts_per_month)} contacts × ${Math.round(a.baseline.scope_share * 100)}% in scope × ${Math.round(a.baseline.chat_share * 100)}% chat)</div>
          <div>Deflected a month</div><div><b>${n(a.projection.deflected_per_month)}</b> at today's ${a.deflection_pct}% rate</div>
          <div>Agent hours saved a month</div><div><b>${n(a.projection.agent_hours_saved_per_month)}</b> at ${n(a.minutes_per_chat)} min per chat</div></div>
        <div class="note-l">A straight line from this console's mix of modes. The business case workbook has the full model with ranges.</div></div>
      <div class="panel"><h2>Assumptions</h2><div class="form" style="grid-template-columns:1fr 1fr">
        <label>Minutes saved per assisted chat<input class="s" type="number" min="0" step="0.1" id="an-saved" value="${a.assumptions.saved_chat_min}"></label>
        <label>Contacts a month<input class="s" type="number" min="0" step="1000" id="an-contacts" value="${a.assumptions.contacts_per_month}"></label></div>
        <div class="note-l">Chat handle time without the copilot: <b>${a.baseline.aht_chat_min} min</b>, from our ticket data (same as the business case).<br>
          Minutes saved = deflected × ${a.baseline.aht_chat_min} + (assisted sends + escalated) × minutes saved per assisted chat. Shadow sends save nothing.</div>
        <div class="bar" style="margin:10px 0 0"><button id="an-save">Save assumptions</button></div></div></div>`;
  $("#an-save").onclick = async () => {
    try{ await api("POST", "/api/control/analytics", {saved_chat_min: Number($("#an-saved").value), contacts_per_month: Math.round(Number($("#an-contacts").value))});
      toast("Assumptions saved."); renderAnalytics(); } catch(e){ toast(e.message); }
  };
}

buildNav();

loadQueue();
if(document.body.classList.contains("dev")) go(screen);
</script>
</body>
</html>
